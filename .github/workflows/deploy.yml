name: Deploy JFinanceiro

# Produção recebe apenas o que chega na main, ou seja, releases e hotfixes finalizados
# pelo git-flow. O deploy só roda depois que os testes passam no mesmo commit.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout projeto
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências Node
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy e otimização
        uses: easingthemes/ssh-deploy@v6.0.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          SSH_CMD_ARGS: >-
            -o StrictHostKeyChecking=no
            -o ControlMaster=auto
            -o ControlPath=/tmp/gha-ssh-%C
            -o ControlPersist=180
          SOURCE: "./"
          TARGET: "/home1/jfinan85/jfinanceiro.com.br"
          # --delete remove do servidor os arquivos que saíram do repositório (por exemplo, uma
          # migration renomeada), para que não voltem a rodar. Tudo que está em EXCLUDE fica
          # protegido da remoção: dependências instaladas no servidor, dados e arquivos de
          # ambiente e da hospedagem (".well-known" é usado na renovação do certificado SSL).
          # "public/.htaccess" fica de fora porque o cPanel grava nele a versão do PHP do site;
          # sobrescrevê-lo fazia o site voltar ao PHP padrão da hospedagem a cada deploy.
          # Mudanças no .htaccess do repositório precisam ser aplicadas manualmente no servidor.
          # "storage/" precisa ficar inteiro de fora, porque guarda o arquivo do modo de
          # manutenção, sessões, logs e uploads.
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: >
            node_modules/,
            .git/,
            .github/,
            vendor/,
            /storage/,
            /bootstrap/cache/,
            /public/storage,
            /public/.htaccess,
            /public/.well-known/,
            /public/cgi-bin/,
            /.env,
            /.ftpquota,
            error_log
          # Coloca o site em manutenção antes de copiar os arquivos, ainda com o código antigo,
          # para que nenhum visitante veja o código novo antes do banco estar migrado.
          SCRIPT_BEFORE: |
            cd /home1/jfinan85/jfinanceiro.com.br
            /opt/cpanel/ea-php84/root/usr/bin/php artisan down --retry=60 || echo "Aviso: nao foi possivel ativar o modo de manutencao"
          # SCRIPT_BEFORE_REQUIRED fica de fora de propósito: a action trata qualquer texto,
          # inclusive "false", como verdadeiro. Uma falha ao entrar em manutenção não deve
          # impedir o deploy, e o "|| echo" acima já garante isso.
          # Se qualquer passo falhar, o site continua em manutenção (e não pela metade) e o job
          # falha no GitHub. Corrija o problema e rode o deploy de novo, ou use "artisan up".
          SCRIPT_AFTER: |
            set -e
            cd /home1/jfinan85/jfinanceiro.com.br

            # Mesmo PHP que serve o site (ea-php84, definido pelo cPanel no public/.htaccess).
            # O /usr/local/bin/php do servidor é 8.3 e resolveria as dependências para outra versão.
            PHP_BIN=/opt/cpanel/ea-php84/root/usr/bin/php
            COMPOSER_PHAR=/home1/jfinan85/composer.phar

            if [ ! -x "$PHP_BIN" ]; then
              echo "ERRO: PHP CLI nao encontrado em $PHP_BIN"
              exit 1
            fi
            if [ ! -f "$COMPOSER_PHAR" ]; then
              echo "ERRO: composer.phar nao encontrado em $COMPOSER_PHAR"
              exit 1
            fi

            echo "PHP: $("$PHP_BIN" -r 'echo PHP_VERSION;')"

            "$PHP_BIN" -d memory_limit=-1 "$COMPOSER_PHAR" install \
              --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress

            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan db:seed --class=AvaliacaoSeeder --force
            "$PHP_BIN" artisan optimize
            "$PHP_BIN" artisan up
          SCRIPT_AFTER_REQUIRED: true
