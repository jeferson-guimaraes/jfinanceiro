name: Deploy JFinanceiro

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout projeto
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências Node
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Deploy e otimização
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          SOURCE: "./"
          TARGET: "/home1/jfinan85/jfinanceiro.com.br"
          EXCLUDE: >
            node_modules/,
            .git/,
            .github/,
            vendor/,
            storage/logs/,
            storage/framework/cache/,
            storage/framework/sessions/,
            storage/framework/views/
          SCRIPT_AFTER: |
            set -e
            cd /home1/jfinan85/jfinanceiro.com.br

            PHP_BIN=/usr/local/bin/php
            COMPOSER_PHAR=/home1/jfinan85/composer.phar

            if [ ! -x "$PHP_BIN" ]; then
              echo "ERRO: PHP CLI nao encontrado em $PHP_BIN"
              exit 1
            fi
            if [ ! -f "$COMPOSER_PHAR" ]; then
              echo "ERRO: composer.phar nao encontrado em $COMPOSER_PHAR"
              exit 1
            fi

            echo "PHP: $("$PHP_BIN" -r 'echo PHP_VERSION;')"

            "$PHP_BIN" -d memory_limit=-1 "$COMPOSER_PHAR" install \
              --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-progress

            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan optimize
          SCRIPT_AFTER_REQUIRED: true
